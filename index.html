<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14213d" />
    <title>파이썬 첫걸음</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  </head>
  <body>
    <!-- 처음 화면 -->
    <section id="home" class="screen home">
      <div class="home-card">
        <div class="home-stage"><div id="home-teacher"></div></div>
        <div class="home-text">
          <p class="home-line" id="home-line"></p>
          <h1 id="home-title"></h1>
          <p class="home-desc">엔트리의 말하기 블록을 파이썬으로 옮겨 봐요. 15분쯤 걸려요.</p>
          <p class="home-done" id="home-done" hidden>✓ 끝낸 수업이에요. 다시 해도 돼요.</p>
          <div class="home-actions">
            <button id="start-lecture" class="btn primary big" type="button" disabled>강의부터 시작</button>
            <button id="start-solve" class="btn big" type="button" disabled>바로 문제 풀기</button>
          </div>
          <label class="sound"><input type="checkbox" id="sound" checked /> 선생님 목소리 켜기</label>
          <p id="home-status" class="status" role="status">파이썬 준비 중…</p>
          <p class="notice">더 좋은 수업을 만들려고, 어떻게 풀었는지 이 기기에 적어 둬요.</p>
        </div>
      </div>
      <span id="build" class="build"></span>
    </section>

    <!-- 수업 화면 -->
    <section id="play" class="screen play" hidden>
      <header class="top">
        <button id="to-home" class="btn small" type="button">← 처음으로</button>
        <div class="where"><span id="where-line"></span><strong id="where-title"></strong></div>
        <ol class="phases" id="phases">
          <li data-phase="lecture">1 강의</li>
          <li data-phase="predict">2 예측</li>
          <li data-phase="task">3 쓰기</li>
        </ol>
        <button id="lecture-again" class="btn small" type="button" hidden>📖 강의 보기</button>
      </header>

      <main class="grid">
        <section class="left">
          <div class="stage"><div id="teacher"></div></div>
          <div class="dialog">
            <span class="nametag">큐브 선생님</span>
            <div id="caption" class="caption" aria-live="polite"></div>
          </div>
          <div id="board"></div>
        </section>
        <section class="right">
          <div class="pane-head">
            <span class="file">main.py</span>
            <span id="lock-note" class="lock-note"></span>
            <button id="run" class="btn primary" type="button" disabled>▶ 실행 <kbd>Ctrl</kbd>+<kbd>Enter</kbd></button>
            <button id="stop" class="btn" type="button" disabled>■ 멈춤</button>
          </div>
          <div id="editor"></div>
          <div class="pane-head"><span class="file">출력</span></div>
          <div id="outwrap">
            <pre id="out" aria-live="polite"></pre>
            <form id="inputform" hidden>
              <label for="inputbox">입력</label>
              <input id="inputbox" autocomplete="off" autocapitalize="off" spellcheck="false" />
              <button class="btn" type="submit">보내기</button>
            </form>
          </div>
        </section>
      </main>

      <footer class="controls">
        <button id="again" class="btn" type="button">🔁 다시 말해 주세요</button>
        <button id="slower" class="btn" type="button">🐢 천천히요</button>
        <button id="skip" class="btn" type="button" hidden>⏭ 강의 건너뛰기</button>
        <span class="spacer"></span>
        <button id="hint" class="btn" type="button" hidden>💡 힌트</button>
        <button id="done" class="btn good big" type="button" hidden>다 했어요</button>
        <button id="submit" class="btn good big" type="button" hidden>제출</button>
        <button id="next" class="btn good big" type="button" hidden>다음</button>
        <button id="finish" class="btn good big" type="button" hidden>처음으로</button>
      </footer>
    </section>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
