<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14213d" />
    <title>파이썬 첫걸음</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  </head>
  <body>
    <!-- 처음 화면: 배우기 / 만들기 / 찾아보기 -->
    <section id="home" class="screen home">
      <header class="top">
        <h1 class="app-name">파이썬 첫걸음</h1>
        <span id="home-status" class="top-status" role="status">파이썬 준비 중…</span>
        <label class="sound"><input type="checkbox" id="sound" checked /> 선생님 목소리</label>
        <a class="btn small" href="./check.html">부모용</a>
      </header>

      <div class="hello">
        <div class="stage hello-stage"><div id="home-teacher"></div></div>
        <div class="dialog">
          <span class="nametag">큐브 선생님</span>
          <div id="home-caption" class="caption"></div>
        </div>
      </div>

      <main class="menu">
        <section class="panel learn" aria-labelledby="learn-title">
          <h2 id="learn-title">배우기</h2>
          <div id="continue"></div>
          <div id="practice-entry"></div>
          <div id="lessons" class="lessons"></div>
        </section>

        <section class="panel make" aria-labelledby="make-title">
          <h2 id="make-title">만들기</h2>
          <p class="panel-desc">마음대로 코드를 쓰고 돌려 보는 곳이에요.</p>
          <button id="new-work" class="btn primary wide" type="button" disabled>＋ 새로 만들기</button>
          <h3>최근에 만든 것</h3>
          <ul id="works" class="works"></ul>
        </section>

        <section class="panel look" aria-labelledby="look-title">
          <h2 id="look-title">찾아보기</h2>
          <p class="panel-desc">지금까지 배운 것을 모아 둬요.</p>
          <div id="reference" class="reference"></div>
        </section>
      </main>

      <footer class="home-foot">
        <span>더 좋은 수업을 만들려고, 어떻게 풀었는지 이 기기에 적어 둬요.</span>
        <span id="build"></span>
      </footer>
    </section>

    <!-- 연습 문제 고르기: 왼쪽에서 단원을, 오른쪽에서 문제를 고른다 -->
    <section id="practice" class="screen practice" hidden>
      <header class="top">
        <button id="practice-home" class="btn small" type="button">← 처음으로</button>
        <h1 class="app-name">연습 문제</h1>
        <span id="practice-total" class="top-status"></span>
      </header>
      <main class="practice-main">
        <nav id="practice-units" class="panel practice-units" aria-label="단원 고르기"></nav>
        <section class="panel practice-list" aria-labelledby="practice-unit-title">
          <h2 id="practice-unit-title"></h2>
          <p id="practice-unit-note" class="panel-desc"></p>
          <ul id="practice-problems" class="problems"></ul>
        </section>
      </main>
    </section>

    <!-- 수업 화면 -->
    <section id="play" class="screen play" hidden>
      <header class="top">
        <button id="to-home" class="btn small" type="button">← 처음으로</button>
        <div class="where"><span id="where-line"></span><strong id="where-title"></strong></div>
        <ol class="phases" id="phases">
          <li data-phase="lecture">1 강의</li>
          <li data-phase="predict">2 예측</li>
          <li data-phase="task">3 쓰기</li>
        </ol>
        <button id="lecture-again" class="btn small" type="button" hidden>📖 강의 보기</button>
      </header>

      <main class="grid">
        <section class="left">
          <div class="stage"><div id="teacher"></div></div>
          <div class="dialog">
            <span class="nametag">큐브 선생님</span>
            <div id="caption" class="caption" aria-live="polite"></div>
          </div>
          <div id="board"></div>
        </section>
        <section class="right">
          <div class="pane-head">
            <span class="file">main.py</span>
            <span id="lock-note" class="lock-note"></span>
            <button id="run" class="btn primary" type="button" disabled>▶ 실행 <kbd>Ctrl</kbd>+<kbd>Enter</kbd></button>
            <button id="stop" class="btn" type="button" disabled>■ 멈춤</button>
          </div>
          <div id="editor" class="editor"></div>
          <div id="vars" class="vars" hidden>
            <span class="vars-label">이름표</span>
            <div id="vars-list" class="vars-list"></div>
          </div>
          <div class="bottom">
            <div class="draw-col" id="draw-col" hidden>
              <div class="pane-head"><span class="file">그림판</span></div>
              <div id="canvas"></div>
            </div>
            <div class="out-col">
              <div class="pane-head"><span class="file">출력</span></div>
              <div id="console"></div>
            </div>
          </div>
        </section>
      </main>

      <footer class="controls">
        <button id="again" class="btn" type="button">🔁 다시 말해 주세요</button>
        <button id="slower" class="btn" type="button">🐢 천천히요</button>
        <button id="skip" class="btn" type="button" hidden>⏭ 강의 건너뛰기</button>
        <span class="spacer"></span>
        <button id="with-lecture" class="btn good big" type="button" hidden>강의부터 볼래요</button>
        <button id="solve-now" class="btn big" type="button" hidden>바로 풀래요</button>
        <button id="challenge-yes" class="btn good big" type="button" hidden>풀어 볼래요</button>
        <button id="challenge-no" class="btn big" type="button" hidden>넘어갈래요</button>
        <button id="give-up" class="btn" type="button" hidden>심화는 그만할래요</button>
        <button id="reset-code" class="btn" type="button" hidden>↺ 처음 코드로</button>
        <button id="hint" class="btn" type="button" hidden>💡 힌트</button>
        <button id="done" class="btn good big" type="button" hidden>다 했어요</button>
        <button id="submit" class="btn good big" type="button" hidden>제출</button>
        <button id="next" class="btn good big" type="button" hidden>다음</button>
        <button id="finish" class="btn good big" type="button" hidden>처음으로</button>
        <button id="to-list" class="btn big" type="button" hidden>목록으로</button>
        <button id="next-problem" class="btn good big" type="button" hidden>다음 문제</button>
      </footer>
    </section>

    <!-- 만들기 화면: 마음대로 쓰고 돌려 보는 곳 -->
    <section id="studio" class="screen play" hidden>
      <header class="top">
        <button id="studio-home" class="btn small" type="button">← 처음으로</button>
        <label class="work-name">이름 <input id="work-name" maxlength="30" autocomplete="off" spellcheck="false" /></label>
        <span id="work-saved" class="top-status" role="status"></span>
      </header>
      <main class="grid studio-grid">
        <section class="right">
          <div class="pane-head">
            <span class="file">main.py</span>
            <span class="lock-note"></span>
            <button id="studio-run" class="btn primary" type="button" disabled>▶ 실행 <kbd>Ctrl</kbd>+<kbd>Enter</kbd></button>
            <button id="studio-stop" class="btn" type="button" disabled>■ 멈춤</button>
          </div>
          <div id="studio-editor" class="editor"></div>
        </section>
        <section class="right">
          <div class="draw-col" id="studio-draw-col" hidden>
            <div class="pane-head"><span class="file">그림판</span></div>
            <div id="studio-canvas"></div>
          </div>
          <div class="pane-head"><span class="file">출력</span></div>
          <div id="studio-console"></div>
        </section>
      </main>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
